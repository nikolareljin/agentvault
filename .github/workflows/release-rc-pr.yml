name: Release RC PR

on:
  create:

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    if: ${{ github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create PR to main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.payload.ref;
            const pattern = /^release\/\d+\.\d+\.\d+(-rc\d+)?$/;
            if (!pattern.test(head)) {
              core.info(`Branch ${head} does not match release pattern; skipping.`);
              return;
            }
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const base = repoInfo.data.default_branch;
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base,
            });
            if (existing.data.length > 0) {
              core.info(`PR already exists for ${head} -> ${base}`);
              return;
            }
            try {
              await github.rest.pulls.create({
                owner, repo, head, base,
                title: `Release: ${head}`,
                body: `Auto-created PR for release branch \`${head}\` into \`${base}\`.`,
              });
            } catch (err) {
              // 403 when "Allow GitHub Actions to create and approve pull
              // requests" is off (Settings > Actions > General). Open it by
              // hand instead. Any other 403 (rate limit, token scope) fails.
              const msg = `${err.message || ''} ${err.response?.data?.message || ''}`;
              if (err.status !== 403 || !/not permitted to create or approve pull requests/i.test(msg)) throw err;
              core.warning(`Actions may not create pull requests here; open it by hand: https://github.com/${owner}/${repo}/compare/${base}...${head}?expand=1`);
              return;
            }
            core.info(`Created PR ${head} -> ${base}`);
