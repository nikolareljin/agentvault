name: PR

on:
  pull_request:
    branches: [main, "release/*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # The Go preset for the gate, not the engine directly. Same reasoning as
  # ci.yml: the engine sets Go up only when a caller names a version, so
  # calling it here meant carrying a `go_version: "1.25"` literal -- a local
  # pin, and the one place this repository could drift from the shared default.
  #
  # The preset takes go.yml's defaults, identically, so a push and a pull
  # request now get the same toolchain and the same module cache. That is the
  # property that makes a green gate mean something.
  #
  # The command overrides are gone for the same reason ci.yml dropped them: the
  # preset's defaults are the same commands, and the point of this repository as
  # the reference adopter is to exercise those defaults rather than a local copy
  # of them. The only difference is that the preset's test default runs
  # `go mod download` first.
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/go-pr-gate.yml@production
    with:
      # Release tag validation is handled by .github/workflows/release-tag-gate.yml.
      # Keeping this disabled avoids a missing local-action path in ci-helpers pr-gate.
      check_release_tag: false
      release_branch: ${{ github.head_ref }}
