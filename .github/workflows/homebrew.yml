name: Homebrew macOS package

# Called by release.yml after the release assets exist (a tag pushed by the
# auto-tag workflow does not trigger workflows on its own); runnable by hand
# for an existing release.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to package, for example 0.13.0"
        required: true
        type: string
      publish:
        description: "Commit the formula to the tap"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]

      - name: Fetch release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          for attempt in {1..20}; do
            if gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" > "$release_json" 2>/dev/null; then
              break
            fi
            test "$attempt" = 20 && exit 1
            sleep 15
          done
          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/agentvault.rb" "$RELEASE_TAG" <<'PY'
          import json
          import re
          import sys

          release_path, formula_path, version = sys.argv[1:]
          assets = {asset["name"]: asset for asset in json.load(open(release_path))["assets"]}
          names = {
              "arm": "agentvault-darwin-arm64",
              "intel": "agentvault-darwin-amd64",
          }
          digests = {}
          for platform, name in names.items():
              asset = assets.get(name)
              digest = asset and asset.get("digest", "")
              if not digest.startswith("sha256:") or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"missing SHA-256 digest for release asset: {name}")
              digests[platform] = digest.removeprefix("sha256:")

          formula = f'''# typed: strict
          # frozen_string_literal: true

          # AgentVault: CLI and TUI for managing agent configurations and instructions.
          class Agentvault < Formula
            desc "CLI and TUI for managing agent configurations and instructions"
            homepage "https://github.com/nikolareljin/agentvault"
            version "{version}"
            license "MIT"
            tag = version.to_s

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/nikolareljin/agentvault/releases/download/#{{tag}}/agentvault-darwin-arm64"
                sha256 "{digests["arm"]}"
              else
                url "https://github.com/nikolareljin/agentvault/releases/download/#{{tag}}/agentvault-darwin-amd64"
                sha256 "{digests["intel"]}"
              end
            end

            def install
              bin.install Dir["agentvault-darwin-*"][0] => "agentvault"
            end

            test do
              assert_match version.to_s, shell_output("#{{bin}}/agentvault version")
            end
          end
          '''
          open(formula_path, "w").write(formula)
          PY

      - name: Validate generated formula
        shell: bash
        run: |
          set -euo pipefail
          brew style "$RUNNER_TEMP/agentvault.rb"
          brew tap-new local/tap
          tap_path="$(brew --repository)/Library/Taps/local/homebrew-tap/Formula"
          cp "$RUNNER_TEMP/agentvault.rb" "$tap_path/agentvault.rb"
          brew install --build-from-source local/tap/agentvault
          brew test local/tap/agentvault
          agentvault version | grep -F "$RELEASE_TAG"

      - name: Upload formula for the tap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: homebrew-formula-agentvault
          path: ${{ runner.temp }}/agentvault.rb
          if-no-files-found: error

  # The package job runs on arm64, so it only executes the arm64 binary.
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]

      - name: Run the darwin-amd64 release binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          asset=agentvault-darwin-amd64
          for attempt in {1..20}; do
            if gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "$asset" -D "$RUNNER_TEMP" 2>/dev/null; then
              break
            fi
            test "$attempt" = 20 && exit 1
            sleep 15
          done
          want="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          got="sha256:$(shasum -a 256 "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "digest mismatch for $asset: got $got, release says $want" >&2
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/$asset"
          "$RUNNER_TEMP/$asset" version | grep -F "$RELEASE_TAG"

  # Commits the formula to the tap with its deploy key; the tap's ruleset lets
  # that key, and only it, push to main.
  publish:
    needs: [package, intel]
    if: ${{ inputs.publish }}
    uses: nikolareljin/ci-helpers/.github/workflows/homebrew-tap-publish.yml@production
    with:
      formula_artifact: homebrew-formula-agentvault
      formula_file: agentvault.rb
      commit_message: "agentvault ${{ inputs.release_tag }}"
    secrets:
      tap_repo: ${{ secrets.HOMEBREW_TAP_REPO }}
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
