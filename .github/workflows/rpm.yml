name: RPM

# Called by release.yml after the release exists (a tag pushed by the
# auto-tag workflow triggers no workflow on its own). By hand, dispatch it on
# the tag itself: gh workflow run rpm.yml --ref 0.15.0 -f release_tag=0.15.0
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to package, for example 0.15.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # rpm-build checks out github.ref and takes the version from VERSION, so
  # the run must be on the tag, and the tag must match VERSION.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] \
            || { echo "::error::run on the tag: --ref $RELEASE_TAG (got $GITHUB_REF)"; exit 1; }
          [[ "$(tr -d '[:space:]' < VERSION)" == "$RELEASE_TAG" ]] \
            || { echo "::error::VERSION is not $RELEASE_TAG"; exit 1; }

  rpm:
    needs: check
    permissions:
      contents: read
    uses: nikolareljin/ci-helpers/.github/workflows/rpm-build.yml@production
    with:
      # No prebuild: with one, build_rpm_artifacts.sh tars the working tree
      # into packaging/rpm/build inside it and tar fails. The spec builds.
      artifact_name: "agentvault-rpm"

  # rpm-build only uploads a workflow artifact; it has no release upload.
  # https://github.com/nikolareljin/ci-helpers/issues/297
  upload:
    needs: rpm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: agentvault-rpm
          path: rpms
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(rpms/*.rpm)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no .rpm built"; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
